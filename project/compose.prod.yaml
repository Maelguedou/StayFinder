# Assemblage pédagogique de production ; change les identifiants avant un vrai déploiement.
services:
  web:
    build:
      context: .
      dockerfile: ./docker/production/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [laravel-production]
    depends_on:
      php-fpm:
        condition: service_started

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: change-this-before-deploy
      REDIS_HOST: redis
    volumes:
      # Persiste storage, pas tout le code applicatif.
      - laravel-storage-production:/var/www/storage
    networks: [laravel-production]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: change-this-before-deploy
    volumes: [postgres-data-production:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [laravel-production]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [laravel-production]

networks:
  laravel-production:

volumes:
  postgres-data-production:
  laravel-storage-production:
