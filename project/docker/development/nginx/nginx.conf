# Nginx reçoit HTTP et relaie les scripts PHP au service php-fpm.
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 80;
        server_name localhost;
        root /var/www/public;
        index index.php index.html;
        # Laravel traite les routes qui ne correspondent pas à un fichier.
        location / { try_files $uri $uri/ /index.php?$query_string; }
        # Docker Compose résout php-fpm par son nom de service sur le réseau privé.
        location ~ \.php$ {
            fastcgi_pass php-fpm:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
        # Ne jamais exposer .env ni d'autres fichiers cachés.
        location ~ /\. { deny all; }
    }
}
